version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: pg_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app_network

  employee-service:
    build:
      context: ./employee-service
      dockerfile: Dockerfile
    container_name: employee_service
    restart: unless-stopped
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      PORT: 3000
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_AWS_APPLICATION_SIGNALS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: xray
      OTEL_TRACES_SAMPLER_ARG: endpoint=http://cloudwatch-agent:2000
      OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT: http://cloudwatch-agent:4316/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://cloudwatch-agent:4316/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://cloudwatch-agent:4316/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://cloudwatch-agent:4316/v1/metrics
      OTEL_EXPORTER_OTLP_ENDPOINT: http://cloudwatch-agent:4316
      OTEL_AWS_SERVICE_EVENTS_EXPORTER_ENDPOINT: http://cloudwatch-agent:4316
      OTEL_RESOURCE_ATTRIBUTES: service.name=boostr-employee-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order_service
    restart: unless-stopped
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      PORT: 3001
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_AWS_APPLICATION_SIGNALS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: xray
      OTEL_TRACES_SAMPLER_ARG: endpoint=http://cloudwatch-agent:2000
      OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT: http://cloudwatch-agent:4316/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://cloudwatch-agent:4316/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://cloudwatch-agent:4316/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://cloudwatch-agent:4316/v1/metrics
      OTEL_EXPORTER_OTLP_ENDPOINT: http://cloudwatch-agent:4316
      OTEL_AWS_SERVICE_EVENTS_EXPORTER_ENDPOINT: http://cloudwatch-agent:4316
      OTEL_RESOURCE_ATTRIBUTES: service.name=boostr-order-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product_service
    restart: unless-stopped
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      PORT: 3002
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_AWS_APPLICATION_SIGNALS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: xray
      OTEL_TRACES_SAMPLER_ARG: endpoint=http://cloudwatch-agent:2000
      OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT: http://cloudwatch-agent:4316/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://cloudwatch-agent:4316/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://cloudwatch-agent:4316/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://cloudwatch-agent:4316/v1/metrics
      OTEL_EXPORTER_OTLP_ENDPOINT: http://cloudwatch-agent:4316
      OTEL_AWS_SERVICE_EVENTS_EXPORTER_ENDPOINT: http://cloudwatch-agent:4316
      OTEL_RESOURCE_ATTRIBUTES: service.name=boostr-product-service
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification_service
    restart: unless-stopped
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      PORT: 3003
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_AWS_APPLICATION_SIGNALS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: xray
      OTEL_TRACES_SAMPLER_ARG: endpoint=http://cloudwatch-agent:2000
      OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT: http://cloudwatch-agent:4316/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://cloudwatch-agent:4316/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://cloudwatch-agent:4316/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://cloudwatch-agent:4316/v1/metrics
      OTEL_EXPORTER_OTLP_ENDPOINT: http://cloudwatch-agent:4316
      OTEL_AWS_SERVICE_EVENTS_EXPORTER_ENDPOINT: http://cloudwatch-agent:4316
      OTEL_RESOURCE_ATTRIBUTES: service.name=boostr-notification-service
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: unless-stopped
    networks:
      - app_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - employee-service
      - order-service
      - product-service
      - notification-service
      - redis
      - frontend
    networks:
      - app_network

  cloudwatch-agent:
    image: public.ecr.aws/cloudwatch-agent/cloudwatch-agent:latest
    container_name: cloudwatch-agent
    restart: unless-stopped
    environment:
      - CW_CONFIG_CONTENT={"logs":{"metrics_collected":{"application_signals":{}}},"traces":{"traces_collected":{"application_signals":{},"xray":{"bind_address":"0.0.0.0:2000"},"otlp":{"grpc_endpoint":"0.0.0.0:4317","http_endpoint":"0.0.0.0:4316"}}}}
    networks:
      - app_network

volumes:
  pg_data:

networks:
  app_network:
    driver: bridge
