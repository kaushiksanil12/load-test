version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: pg_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app_network

  employee-service:
    build:
      context: ./employee-service
      dockerfile: Dockerfile
    container_name: employee_service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      PORT: 3000
      # Elastic APM Configuration
      ELASTIC_APM_SERVICE_NAME: boostr-employee-service
      ELASTIC_APM_SERVER_URL: ${ELASTIC_APM_SERVER_URL:-http://host.docker.internal:8200}
      ELASTIC_APM_API_KEY: ${ELASTIC_APM_API_KEY:-}
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN:-}
      ELASTIC_APM_VERIFY_SERVER_CERT: ${ELASTIC_APM_VERIFY_SERVER_CERT:-false}
      ELASTIC_APM_ENVIRONMENT: ${ELASTIC_APM_ENVIRONMENT:-development}
      ELASTIC_APM_ACTIVE: ${ELASTIC_APM_ACTIVE:-true}
      ELASTIC_APM_LOG_LEVEL: ${ELASTIC_APM_LOG_LEVEL:-info}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order_service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      PORT: 3001
      # Elastic APM Configuration
      ELASTIC_APM_SERVICE_NAME: boostr-order-service
      ELASTIC_APM_SERVER_URL: ${ELASTIC_APM_SERVER_URL:-http://host.docker.internal:8200}
      ELASTIC_APM_API_KEY: ${ELASTIC_APM_API_KEY:-}
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN:-}
      ELASTIC_APM_VERIFY_SERVER_CERT: ${ELASTIC_APM_VERIFY_SERVER_CERT:-false}
      ELASTIC_APM_ENVIRONMENT: ${ELASTIC_APM_ENVIRONMENT:-development}
      ELASTIC_APM_ACTIVE: ${ELASTIC_APM_ACTIVE:-true}
      ELASTIC_APM_LOG_LEVEL: ${ELASTIC_APM_LOG_LEVEL:-info}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product_service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      PORT: 3002
      REDIS_URL: redis://redis:6379
      # Elastic APM Configuration
      ELASTIC_APM_SERVICE_NAME: boostr-product-service
      ELASTIC_APM_SERVER_URL: ${ELASTIC_APM_SERVER_URL:-http://host.docker.internal:8200}
      ELASTIC_APM_API_KEY: ${ELASTIC_APM_API_KEY:-}
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN:-}
      ELASTIC_APM_VERIFY_SERVER_CERT: ${ELASTIC_APM_VERIFY_SERVER_CERT:-false}
      ELASTIC_APM_ENVIRONMENT: ${ELASTIC_APM_ENVIRONMENT:-development}
      ELASTIC_APM_ACTIVE: ${ELASTIC_APM_ACTIVE:-true}
      ELASTIC_APM_LOG_LEVEL: ${ELASTIC_APM_LOG_LEVEL:-info}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification_service
    restart: unless-stopped
    environment:
      PORT: 3003
      # Elastic APM Configuration
      ELASTIC_APM_SERVICE_NAME: boostr-notification-service
      ELASTIC_APM_SERVER_URL: ${ELASTIC_APM_SERVER_URL:-http://host.docker.internal:8200}
      ELASTIC_APM_API_KEY: ${ELASTIC_APM_API_KEY:-}
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN:-}
      ELASTIC_APM_VERIFY_SERVER_CERT: ${ELASTIC_APM_VERIFY_SERVER_CERT:-false}
      ELASTIC_APM_ENVIRONMENT: ${ELASTIC_APM_ENVIRONMENT:-development}
      ELASTIC_APM_ACTIVE: ${ELASTIC_APM_ACTIVE:-true}
      ELASTIC_APM_LOG_LEVEL: ${ELASTIC_APM_LOG_LEVEL:-info}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: unless-stopped
    networks:
      - app_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - employee-service
      - order-service
      - product-service
      - notification-service
      - redis
      - frontend
    networks:
      - app_network

  # Continuous Traffic Generator (Simulates ongoing user activity for APM and ELK)
  load-generator:
    image: curlimages/curl:latest
    container_name: load_generator
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - app_network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "🚀 Continuous Load Generator started. Sending transactions to ELK/APM..."
        sleep 5
        while true; do
          # 1. Standard GET queries
          curl -s -o /dev/null -w "%{http_code} GET /api/employees\n" http://nginx/api/employees || true
          sleep 0.8
          curl -s -o /dev/null -w "%{http_code} GET /api/products\n" http://nginx/api/products || true
          sleep 0.8
          curl -s -o /dev/null -w "%{http_code} GET /api/orders\n" http://nginx/api/orders || true
          sleep 0.8
          curl -s -o /dev/null -w "%{http_code} GET /api/stats\n" http://nginx/api/stats || true
          sleep 0.8
          curl -s -o /dev/null -w "%{http_code} GET /api/departments\n" http://nginx/api/departments || true
          sleep 0.8
          # 2. Multi-tier order creation (order-service -> employee -> product -> notification)
          curl -s -X POST -o /dev/null -w "%{http_code} POST /api/orders\n" http://nginx/api/orders || true
          sleep 0.8
          # 3. CPU computation endpoint
          curl -s -o /dev/null -w "%{http_code} GET /api/heavy\n" http://nginx/api/heavy || true
          sleep 1
        done

volumes:
  pg_data:

networks:
  app_network:
    driver: bridge
