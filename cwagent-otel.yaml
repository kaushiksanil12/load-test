receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4316

exporters:
  awscloudwatchlogs:
    log_group_name: "/aws/service-events/boostr-notification-service"
    log_stream_name: "{Service}"

service:
  pipelines:
    logs/cwagent:
      receivers: [otlp]
      exporters: [awscloudwatchlogs]
